apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kevin1-john1/KTDOPS.git
    targetRevision: main
    path: project-gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: project-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true