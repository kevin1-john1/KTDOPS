name: GitOps release Log output

on:
  push:
    branches:
      - main
    paths:
      - "log-output/**"
      - ".github/workflows/log-output-gitops.yaml"

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-publish-release:
    name: Build, publish and update manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Log output writer
        run: |
          docker build -t "$DOCKERHUB_USERNAME/log-output-writer:$IMAGE_TAG" ./log-output/writer
          docker push "$DOCKERHUB_USERNAME/log-output-writer:$IMAGE_TAG"

      - name: Build and publish Log output reader
        run: |
          docker build -t "$DOCKERHUB_USERNAME/log-output-reader:$IMAGE_TAG" ./log-output/reader
          docker push "$DOCKERHUB_USERNAME/log-output-reader:$IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Kustomize images
        working-directory: log-output
        run: |
          kustomize edit set image PROJECT/LOG_OUTPUT_WRITER="$DOCKERHUB_USERNAME/log-output-writer:$IMAGE_TAG"
          kustomize edit set image PROJECT/LOG_OUTPUT_READER="$DOCKERHUB_USERNAME/log-output-reader:$IMAGE_TAG"

      - name: Commit updated image tags
        uses: EndBug/add-and-commit@v10
        with:
          add: "log-output/kustomization.yaml"
          message: "Release log-output ${{ github.sha }}"
          default_author: github_actions